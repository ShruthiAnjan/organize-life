<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rua</title>
<meta name="theme-color" content="#F7F4F0">
<meta name="description" content="Rua — your personal life planner: tasks, money, career, learning, wellness and memories in one calm place.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/rua.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rua">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 44 44"><rect x="1" y="1" width="42" height="42" rx="12" fill="#F1E8DF"/><path d="M11 34V21a11 11 0 0 1 22 0v13" fill="#E3D3C5"/><circle cx="22" cy="27" r="5.2" fill="#C98770"/><path d="M11 34V21a11 11 0 0 1 22 0v13" fill="none" stroke="#9C6B4E" stroke-width="1.6"/><path d="M8 34h28" stroke="#37352F" stroke-width="1.6" stroke-linecap="round"/><path d="M22 9.5v2.2M14.6 12.4l1.4 1.6M29.4 12.4 28 14" stroke="#9C6B4E" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text"><span class="bt">Rua</span><b>plan · live · grow</b></div>
      <button class="icon-btn collapse-btn" data-action="toggle-sidebar" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sync-status"></div>
  </aside>
  <div id="scrim" data-action="close-sidebar"></div>
  <main id="main">
    <header id="topbar">
      <button class="icon-btn menu-btn" data-action="open-sidebar" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="global-search" type="search" placeholder="Search tasks, expenses, jobs, notes…" autocomplete="off" aria-label="Search everything">
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" data-action="focus-mode" title="Focus mode" aria-label="Focus mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="icon-btn bell" data-route="notifications" title="Notifications" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span id="bell-count" hidden></span></button>
        <button class="btn primary quick-add" data-action="quick-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Quick add</span></button>
      </div>
    </header>
    <div id="view" tabindex="-1"></div>
  </main>
</div>
<button id="fab" data-action="quick-add" aria-label="Quick add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tooltip" role="tooltip" hidden></div>
<input type="file" id="file-picker" accept="image/jpeg,image/png,image/webp" hidden multiple>
<input type="file" id="json-picker" accept="application/json,.json" hidden>
<script src="js/core.js"></script>
<script src="js/charts.js"></script>
<script src="js/p-home.js"></script>
<script src="js/p-planner.js"></script>
<script src="js/p-finance.js"></script>
<script src="js/p-career.js"></script>
<script src="js/p-learning.js"></script>
<script src="js/p-life.js"></script>
<script src="js/p-goals.js"></script>
<script src="js/p-vision.js"></script>
<script src="js/p-reports.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
